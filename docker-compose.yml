services:
  db:
    image: pgvector/pgvector:pg16
    container_name: skillbridge_db
    restart: always
    environment:
      POSTGRES_USER: skillbridge_user
      POSTGRES_PASSWORD: skillbridge_password
      POSTGRES_DB: skillbridge_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: skillbridge_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  
volumes:
  postgres_data:
  redis_data: